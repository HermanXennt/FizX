{% extends "emails/base_email.html" %}
{% block content %}
<p style="font-size:16px;color:#1d1d1f;margin:0 0 16px;">Hi there,</p>
<p style="font-size:14px;color:#1d1d1f;line-height:1.6;margin:0 0 24px;">
  <strong>{{ inviter_name }}</strong> invited you to join <strong>{{ workspace_name }}</strong> on FizX as a {{ role }}.
</p>
<p style="text-align:center;margin:0 0 24px;">
  <a href="{{ invitation_url }}" style="display:inline-block;background-color:#111113;color:#ffffff;text-decoration:none;padding:12px 28px;border-radius:9999px;font-size:14px;font-weight:500;">
    Accept invitation
  </a>
</p>
<p style="font-size:12px;color:#86868b;margin:0;word-break:break-all;">{{ invitation_url }}</p>
{% endblock %}
