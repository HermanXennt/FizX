{% extends "emails/base_email.html" %}
{% block content %}
<p style="font-size:16px;color:#1d1d1f;margin:0 0 16px;">Hi {{ first_name|default:"there" }},</p>
<p style="font-size:14px;color:#1d1d1f;line-height:1.6;margin:0 0 24px;">
  We received a request to reset your FizX password. This link expires in 24 hours.
</p>
<p style="text-align:center;margin:0 0 24px;">
  <a href="{{ reset_url }}" style="display:inline-block;background-color:#111113;color:#ffffff;text-decoration:none;padding:12px 28px;border-radius:9999px;font-size:14px;font-weight:500;">
    Reset password
  </a>
</p>
<p style="font-size:12px;color:#86868b;margin:0;word-break:break-all;">{{ reset_url }}</p>
{% endblock %}
