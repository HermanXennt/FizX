{% extends "emails/base_email.html" %}
{% block content %}
<p style="font-size:16px;color:#1d1d1f;margin:0 0 12px;">{{ title }}</p>
<p style="font-size:14px;color:#1d1d1f;line-height:1.6;margin:0 0 24px;">{{ body }}</p>
{% if action_url %}
<p style="text-align:center;margin:0 0 24px;">
  <a href="{{ action_url }}" style="display:inline-block;background-color:#111113;color:#ffffff;text-decoration:none;padding:12px 28px;border-radius:9999px;font-size:14px;font-weight:500;">
    View in FizX
  </a>
</p>
{% endif %}
{% endblock %}
