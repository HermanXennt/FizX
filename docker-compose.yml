x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: config.settings.production
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  # Defaults to true (secure-by-default). Set to false in .env only when running
  # without a TLS-terminating proxy in front of nginx (e.g. local docker-compose testing).
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-true}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
  POSTGRES_DB: ${POSTGRES_DB:-fizx}
  POSTGRES_USER: ${POSTGRES_USER:-fizx}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  # whatsapp-otp runs standalone on the host (not a container on this compose
  # network - see /whatsapp-otp), so it's reached the same way LiveKit's HTTP
  # API is: via host.docker.internal, not a Docker DNS service name.
  WHATSAPP_OTP_URL: ${WHATSAPP_OTP_URL:-http://host.docker.internal:3210}
  WHATSAPP_OTP_API_KEY: ${WHATSAPP_OTP_API_KEY}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret_change_me_in_prod_min_32_chars}
  LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
  # livekit runs on network_mode: host (see below), so it's no longer
  # reachable via the "livekit" Docker DNS name from bridge-networked
  # containers like this one - host.docker.internal + host-gateway
  # (extra_hosts, below) is what makes this resolve correctly.
  LIVEKIT_HTTP_URL: http://host.docker.internal:7880
  TURN_SHARED_SECRET: ${TURN_SHARED_SECRET}
  TURN_REALM: ${TURN_REALM:-fizx.local}
  STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_ID_PRO: ${STRIPE_PRICE_ID_PRO:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  # Self-hosted MinIO (S3-compatible) for recordings + other media. The LAN
  # IP (not host.docker.internal) is required here specifically because
  # LiveKit's egress process runs in the host-networked livekit container
  # (see below) - it needs an address reachable the same way regardless of
  # which container's network namespace is asking, and a real LAN IP is the
  # one address that works from both a bridge network and host networking.
  AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-fizx-recordings}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-fizx-minio}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-change-me-minio-secret}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
  AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-us-east-1}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fizx}
      POSTGRES_USER: ${POSTGRES_USER:-fizx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fizx}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [fizx]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Published to localhost only - this is what lets the host-networked
    # livekit container (see below) reach redis via 127.0.0.1:6380, since it
    # can no longer use the "redis" Docker DNS name once it's off the bridge
    # network. Host port deliberately isn't 6379 - that's the standard Redis
    # port, and a stray host-level Redis/Valkey (or another project's own
    # compose stack) binding it first would otherwise make this fail to
    # start with "address already in use" for a reason that has nothing to
    # do with this project.
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [fizx]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-fizx-minio}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-change-me-minio-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [fizx]

  # One-shot: creates the recordings bucket on first boot, then exits. MinIO
  # itself has no "create this bucket at startup" option, unlike a managed
  # S3 bucket you'd provision once outside the app.
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-fizx-minio} ${AWS_SECRET_ACCESS_KEY:-change-me-minio-secret} &&
      mc mb -p local/${AWS_STORAGE_BUCKET_NAME:-fizx-recordings} &&
      mc anonymous set download local/${AWS_STORAGE_BUCKET_NAME:-fizx-recordings}
      "
    networks: [fizx]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *django-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Localhost-only, so the host-networked livekit container can deliver
    # egress webhooks (recording status/file_url) via plain http://localhost
    # without going through nginx/TLS - same reasoning as redis's port
    # publish above. Not reachable from the LAN or internet.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/app/mediafiles
      - static_data:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [fizx]

  celery_worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency=4
    environment: *django-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media_data:/app/mediafiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [fizx]

  celery_beat:
    build:
      context: ./backend
    restart: unless-stopped
    command: celery -A config beat -l info
    environment: *django-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [fizx]

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    # WebRTC media is many long-lived UDP "connections" punched through to
    # fixed ports. Docker's bridge-network NAT/conntrack doesn't track those
    # the way RTP expects - in testing this reliably dropped every call
    # around the 50-60s mark (PEER_CONNECTION_DISCONNECTED in livekit's
    # logs) even with the correct NODE_IP advertised. Host networking - the
    # same reasoning already applied to coturn below - removes Docker's NAT
    # from the media path entirely.
    network_mode: host
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret_change_me_in_prod_min_32_chars}"
      # The address LiveKit advertises in ICE candidates. Must be an address
      # clients can actually reach: the host's LAN IP for local/LAN testing,
      # or the server's public IP (with the UDP/TCP ports below forwarded)
      # for a real internet-facing deployment.
      NODE_IP: ${LIVEKIT_NODE_IP}
      # The full config goes here instead of mounting infra/livekit/livekit.yaml
      # as a file, because webhook.api_key needs ${LIVEKIT_API_KEY} substituted
      # into it - compose only does that substitution on this file itself, not
      # on the contents of a file it mounts as a volume.
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: false
        redis:
          address: 127.0.0.1:6380
          db: 3
        room:
          auto_create: true
          empty_timeout: 600
          departure_timeout: 20
        webhook:
          api_key: ${LIVEKIT_API_KEY:-devkey}
          urls:
            - http://localhost:8000/api/v1/recordings/webhook/
        logging:
          level: info
    depends_on:
      redis:
        condition: service_healthy

  # Recording (egress) is a separate worker process from livekit-server
  # itself - the server only dispatches egress jobs over redis, a worker
  # has to actually be running to pick them up and render/upload them, or
  # start_room_composite_egress just times out with "no response from
  # servers" forever.
  livekit-egress:
    image: livekit/egress:latest
    restart: unless-stopped
    # Same reasoning as livekit/coturn above - needs to reach redis and the
    # livekit server via plain localhost, and subscribes to room media the
    # same way a participant would.
    network_mode: host
    # Chrome (used internally for room-composite layout rendering) needs
    # this capability to run its sandbox inside a container.
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-devkey}
        api_secret: ${LIVEKIT_API_SECRET:-devsecret_change_me_in_prod_min_32_chars}
        ws_url: ws://localhost:7880
        redis:
          address: 127.0.0.1:6380
          db: 3
    depends_on:
      redis:
        condition: service_healthy

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    # TURN relays real public-facing media ports; Docker's bridge-network NAT
    # breaks TURN candidate allocation, so this runs on the host network -
    # the standard deployment pattern for coturn.
    network_mode: host
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
      - "--realm=${TURN_REALM:-fizx.local}"
      - "--static-auth-secret=${TURN_SHARED_SECRET}"
      # On a cloud VM (AWS/GCP/etc) the instance only has a private IP on its
      # actual interface - the provider NATs that to the public IP at the
      # network level, so coturn's own interface discovery only ever sees
      # the private one and relays traffic from/announces that to clients,
      # which is unreachable from the internet. TURN_RELAY_IP (set to the
      # instance's private IP) tells coturn to announce TURN_PUBLIC_IP to
      # clients while still binding/relaying on the private address it can
      # actually see. Leave TURN_RELAY_IP unset on a bare LAN/VPS host where
      # the public-facing IP *is* the real interface address.
      - "--external-ip=${TURN_PUBLIC_IP:-127.0.0.1}${TURN_RELAY_IP:+/${TURN_RELAY_IP}}"
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro

  frontend:
    build:
      context: ./frontend
      args:
        # Left empty by default: the frontend derives these from the
        # browser's own origin at runtime (see lib/api-client.ts,
        # lib/websocket.ts, lib/livekit-url.ts), so one build works from
        # localhost, a LAN IP, or a real domain. Only set these if the API
        # or LiveKit are genuinely hosted on a different origin.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    networks: [fizx]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/proxy-common.conf:/etc/nginx/proxy-common.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
      - frontend
    networks: [fizx]

networks:
  fizx:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
  minio_data:
