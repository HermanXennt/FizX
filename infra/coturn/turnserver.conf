# Static coturn settings. Secrets and the public IP are injected via CLI flags
# in docker-compose.yml (so they can come from the root .env without baking
# them into this file).

listening-port=3478
tls-listening-port=5349

min-port=49152
max-port=49500

fingerprint
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

log-file=stdout
simple-log
