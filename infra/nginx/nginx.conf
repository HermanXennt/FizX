events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 50M;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    # livekit runs on network_mode: host (see docker-compose.yml), so it's
    # reached the same way the backend container reaches it: via
    # host.docker.internal, not a Docker DNS service name.
    upstream livekit {
        server host.docker.internal:7880;
    }

    # getUserMedia (camera/mic) is only available in "secure contexts" -
    # https, or the literal host "localhost" - so a LAN-IP deployment with
    # no real domain still needs a cert (self-signed is fine; browsers can
    # be clicked through) for calls to capture audio/video at all. Plain
    # HTTP redirects to HTTPS below for browser traffic.
    #
    # The /api/ and /ws/ exceptions below exist for the React Native app
    # (FizX Meet App/) - a native client has no browser secure-context/
    # mixed-content restriction, so it has no reason to deal with trusting
    # a self-signed cert. Only those two prefixes are exempted; everything
    # else (the site itself) still redirects to HTTPS exactly as before.
    #
    # server_name lists the production domain explicitly (so it's clear at
    # a glance what this deploys to) plus "_" as a catch-all, since this
    # same file is also used for local dev over a LAN IP with a self-signed
    # cert (infra/nginx/certs/, regenerated per-IP by ./scripts/start.sh) -
    # there's only one server block per port either way, so this doesn't
    # change request routing, just documents the real deployment target.
    server {
        listen 80;
        server_name fizx.work.gd _;

        location /api/ {
            proxy_pass http://backend;
            include /etc/nginx/proxy-common.conf;
        }

        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            include /etc/nginx/proxy-common.conf;
            proxy_read_timeout 3600s;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name fizx.work.gd _;

        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            include /etc/nginx/proxy-common.conf;
            proxy_read_timeout 3600s;
        }

        # Proxies the browser's LiveKit signaling WebSocket under this same
        # HTTPS origin - connecting directly to ws://host:7880 from a page
        # loaded over https would be blocked outright as mixed content.
        # LiveKit's own server has no TLS of its own; nginx terminates it
        # here, same as it already does for the Channels websocket above.
        location /livekit/ {
            proxy_pass http://livekit/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            include /etc/nginx/proxy-common.conf;
            proxy_read_timeout 3600s;
        }

        location ~ ^/(api|admin|static|media)/ {
            proxy_pass http://backend;
            include /etc/nginx/proxy-common.conf;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            include /etc/nginx/proxy-common.conf;
        }
    }
}
